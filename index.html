<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte de visite</title>
<style>
  @font-face { font-family:"LOccitane Sans"; font-weight:400; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSans-Regular.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Sans"; font-weight:500; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSans-Medium.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Serif Condensed"; font-weight:500; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSerifCondensed-Medium.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Serif"; font-weight:400; font-style:italic; font-display:swap; src:url("fonts/LOccitaneSerif-Italic.woff2") format("woff2"); }
  :root { --accent:#FFC700; --bg:#F2E9DB; --card:#F9F5F0; --text:#3F2B2E; --muted:rgba(63,43,46,.72); --line:#F2E9DB; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:"LOccitane Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); padding:20px; }
  body::before { content:""; position:fixed; inset:0; z-index:-1; background:url("fond.jpg") center/cover no-repeat;
                 filter:blur(9px); transform:scale(1.08); }
  body::after { content:""; position:fixed; inset:0; z-index:-1; background:rgba(242,233,219,.18); }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:20px; padding:32px 24px;
          box-shadow:0 2px 6px rgba(63,43,46,.10), 0 18px 36px rgba(63,43,46,.22), 0 44px 80px rgba(63,43,46,.28); text-align:center; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avwrap { width:112px; margin:0 auto 16px; }
  .badge { display:table; margin:10px auto 0; background:var(--accent); color:var(--text); font-weight:500; font-size:12px; letter-spacing:.08em;
           padding:3px 12px; border-radius:999px; }
  .avatar { width:112px; height:112px; overflow:hidden; border-radius:50%; background:var(--accent); color:var(--text);
            display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:600; margin:0; }
  h1 { margin:0; font-family:"LOccitane Serif Condensed",Georgia,serif; font-weight:500; font-size:32px; letter-spacing:.03em; text-transform:uppercase; }
  .title { margin:8px -12px 2px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
  .sep { width:56px; height:2px; border:0; background:var(--accent); margin:16px auto 0; }
  .bio { margin:16px 8px 0; font-family:"LOccitane Serif",Georgia,serif; font-style:italic; font-weight:400; font-size:14px; line-height:1.5; color:var(--muted); }
  .org { margin:0 0 22px; }
  .org img { width:170px; max-width:70%; height:auto; display:inline-block; }
  .infos { margin:24px 0; text-align:left; }
  .infos a { display:flex; align-items:center; gap:12px; padding:12px 8px; color:var(--text); text-decoration:none;
             border-top:1px solid var(--line); font-size:16px; word-break:break-word; }
  .infos a:last-child { border-bottom:1px solid var(--line); }
  .infos span.ic { width:28px; text-align:center; font-size:18px; }
  .infos > :last-child { border-bottom:1px solid var(--line); }
  .lieux { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 20px; }
  .tile { aspect-ratio:1/1; background:var(--line); border-radius:16px; padding:12px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; gap:6px; }
  .tile .pin { font-size:20px; }
  .tile strong { font-weight:500; font-size:16px; letter-spacing:.02em; }
  .tile .site { font-size:12px; line-height:1.35; color:var(--muted); }
  .btn { font-family:inherit; display:block; width:100%; padding:14px; border-radius:12px; font-size:16px; font-weight:500;
         text-decoration:none; border:none; cursor:pointer; margin-top:10px; }
  .btn.primary { background:var(--accent); color:var(--text); }
  .maison { display:block; margin-top:18px; text-align:center; font-size:14px; color:var(--text); text-decoration:underline; text-underline-offset:3px; }
  .icons { display:flex; justify-content:center; gap:16px; margin-top:18px; }
  .li, .lo { display:block; width:52px; height:52px; }
  .lo { border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; }
  .lo img { width:56%; height:auto; display:block; }
  .li { border-radius:50%; background:#007EBB; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .li img { width:80%; height:80%; display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="org" id="org"></div>
  <div class="avwrap">
    <div class="avatar" id="avatar"></div>
  </div>
  <h1 id="fullname"></h1>
  <span class="badge" id="badge"></span>
  <div class="title" id="jobtitle"></div>
  <hr class="sep" id="sep">
  <p class="bio" id="bio"></p>

  <div class="infos" id="infos"></div>
  <div class="lieux" id="lieux"></div>

  <button class="btn primary" id="addBtn">➕ Add to contacts</button>
  <div class="icons">
    <a class="lo" id="maisonLink" target="_blank" rel="noopener" aria-label="Découvrir la Maison L'Occitane en Provence"><img src="lo.png" alt="L'Occitane en Provence"></a>
    <a class="li" id="linkedinBtn" target="_blank" rel="noopener" aria-label="Profil LinkedIn"><img src="linkedin.svg" alt="LinkedIn"></a>
  </div>
</div>

<script>
/* ============ À MODIFIER : tes informations ============ */
const C = {
  prenom:   "Guillaume",
  nom:      "Rodriguez",
  titre:    "Clinical Evaluation & Neurosciences Research Specialist",
  societe:  "L'Occitane en Provence",
  tel:      "+33 4 92 70 62 86",
  email:    "guillaume.rodriguez@loccitane.com",
  linkedin: "https://www.linkedin.com/in/guillaume-rodriguez-phd-64070898/",
  bio:      "Developing the neuroscience strategy at L'Occitane en Provence. Innovation and scientific rigor, applied to clinical evaluation.",
  lienSociete: "https://fr.loccitane.com/qui-sommes-nous",   // le logo renvoie vers cette page
  badge:    "PhD",         // laisse "" pour ne pas afficher de badge
  logo:     "logo.png",    // laisse "" pour afficher le nom de la société en texte
  photo:    "photo.jpg",   // laisse "" pour afficher les initiales
  lieux:    [
    { ville: "Manosque",  site: "R&D Center" },
    { ville: "Marseille", site: "Cosnat Neuroscience & Clinical Evaluation Lab" }
  ]
};
/* ======================================================== */

const full = C.prenom + " " + C.nom;
document.title = full + " – Carte de visite";
document.getElementById("fullname").textContent = full;
const jobtitle = document.getElementById("jobtitle");
const jobspan = document.createElement("span");
jobspan.textContent = C.titre;
jobtitle.appendChild(jobspan);
function fitTitle() {
  const avail = document.querySelector(".card").clientWidth - 24 - 16;
  let size = 13;
  jobtitle.style.fontSize = size + "px";
  while (jobspan.getBoundingClientRect().width > avail && size > 6) {
    size -= 0.25;
    jobtitle.style.fontSize = size + "px";
  }
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
window.addEventListener("resize", fitTitle);
if (C.bio) document.getElementById("bio").textContent = C.bio; else { document.getElementById("bio").remove(); document.getElementById("sep").remove(); }
const org = document.getElementById("org");
if (C.logo) {
  const logo = document.createElement("img");
  logo.src = C.logo;
  logo.alt = C.societe;
  logo.onerror = () => { org.textContent = C.societe; };
  if (C.lienSociete) {
    const a = document.createElement("a");
    a.href = C.lienSociete;
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", C.societe);
    a.appendChild(logo);
    org.appendChild(a);
  } else {
    org.appendChild(logo);
  }
} else {
  org.textContent = C.societe;
}
const badge = document.getElementById("badge");
if (C.badge) badge.textContent = C.badge; else badge.remove();
const avatar = document.getElementById("avatar");
if (C.photo) {
  const img = document.createElement("img");
  img.src = C.photo;
  img.alt = full;
  img.onerror = () => { avatar.textContent = (C.prenom[0] + C.nom[0]).toUpperCase(); };
  avatar.appendChild(img);
} else {
  avatar.textContent = (C.prenom[0] + C.nom[0]).toUpperCase();
}
document.getElementById("linkedinBtn").href = C.linkedin;
const maison = document.getElementById("maisonLink");
if (C.lienSociete) maison.href = C.lienSociete; else maison.remove();

const infos = document.getElementById("infos");
[["📞", C.tel, "tel:" + C.tel.replace(/\s/g,"")],
 ["✉️", C.email, "mailto:" + C.email]].forEach(([ic, label, href]) => {
  if (!label) return;
  const a = document.createElement(href ? "a" : "div");
  if (href) a.href = href; else a.className = "loc";
  a.innerHTML = '<span class="ic">' + ic + '</span><span></span>';
  a.lastChild.textContent = label;
  infos.appendChild(a);
});

const lieux = document.getElementById("lieux");
(C.lieux || []).forEach(l => {
  const t = document.createElement("div");
  t.className = "tile";
  t.innerHTML = '<span class="pin">📍</span><strong></strong><span class="site"></span>';
  t.querySelector("strong").textContent = l.ville;
  t.querySelector(".site").textContent = l.site;
  lieux.appendChild(t);
});

function vcard() {
  return [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:" + C.nom + ";" + C.prenom + ";;;",
    "FN:" + full,
    "ORG:" + C.societe,
    "TITLE:" + C.titre,
    "TEL;TYPE=WORK,VOICE:" + C.tel,
    "EMAIL;TYPE=INTERNET:" + C.email,
    "URL;TYPE=LinkedIn:" + C.linkedin,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");
}

document.getElementById("addBtn").addEventListener("click", () => {
  const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (C.prenom + "-" + C.nom).toLowerCase() + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});
</script>
</body>
</html>
