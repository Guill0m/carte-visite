<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de visite</title>
<style>
  @font-face { font-family:"LOccitane Sans"; font-weight:400; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSans-Regular.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Sans"; font-weight:500; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSans-Medium.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Serif Condensed"; font-weight:500; font-style:normal; font-display:swap; src:url("fonts/LOccitaneSerifCondensed-Medium.woff2") format("woff2"); }
  @font-face { font-family:"LOccitane Serif"; font-weight:400; font-style:italic; font-display:swap; src:url("fonts/LOccitaneSerif-Italic.woff2") format("woff2"); }
  :root { --accent:#FFC700; --bg:#F2E9DB; --card:#F9F5F0; --text:#3F2B2E; --muted:rgba(63,43,46,.72); --line:#F2E9DB; }
  * { box-sizing:border-box; }
  html { min-height:100%; min-height:100lvh; background:#F2E9DB; }
  .top { position:fixed; top:0; left:0; right:0; z-index:5; background:#F2E9DB; text-align:center; padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
         box-shadow:0 1px 0 rgba(63,43,46,.08), 0 6px 18px rgba(63,43,46,.08); animation:down .8s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes down { from{transform:translateY(-100%)} to{transform:none} }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
         font-family:"LOccitane Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text);
         padding:calc(max(12px, env(safe-area-inset-top)) + 52px) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:20px; padding:20px 20px;
          box-shadow:0 2px 6px rgba(63,43,46,.10), 0 18px 36px rgba(63,43,46,.22), 0 44px 80px rgba(63,43,46,.28); text-align:center; position:relative; z-index:2; animation:emerge 1s cubic-bezier(.2,.8,.2,1) .9s both; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avwrap { position:relative; width:104px; margin:0 auto 10px; }
  .ring { position:absolute; inset:-4px; border-radius:50%; background:conic-gradient(#FFC700,rgba(255,199,0,0) 55%,#FFC700); animation:spin 5s linear infinite; }
  .badge { display:table; margin:8px auto 0; background:var(--accent); color:var(--text); font-weight:500; font-size:11px; letter-spacing:.08em;
           padding:2px 11px; border-radius:999px; }
  .avatar { position:relative; width:104px; height:104px; overflow:hidden; border-radius:50%; background:var(--accent); color:var(--text);
            display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:600; margin:0; }
  h1 { margin:0; font-family:"LOccitane Serif Condensed",Georgia,serif; font-weight:500; font-size:24px; letter-spacing:.03em; }
  h1 .fn { text-transform:none; }
  h1 .ln { text-transform:uppercase; }
  .title { margin:6px -12px 0; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
  .sep { width:56px; height:2px; border:0; background:var(--accent); margin:12px auto 0; }
  .bio { margin:10px 4px 0; font-family:"LOccitane Serif",Georgia,serif; font-style:italic; font-weight:400; font-size:13px; line-height:1.45; color:var(--muted); }
  .org { margin:0; line-height:0; }
  .org img { width:112px; max-width:60%; height:auto; display:inline-block; }
  .infos { margin:14px 0; text-align:left; }
  .infos a { display:flex; align-items:center; gap:10px; padding:8px 8px; color:var(--text); text-decoration:none;
             border-top:1px solid var(--line); font-size:13px; word-break:break-word; }
  .infos a:last-child { border-bottom:1px solid var(--line); }
  .infos svg, .tile svg, .btn svg { flex:none; width:16px; height:16px; }
  .infos > :last-child { border-bottom:1px solid var(--line); }
  .lieux { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:0 0 12px; }
  .tile { background:var(--line); border-radius:12px; padding:9px 8px 10px; display:flex; flex-direction:column;
          align-items:center; justify-content:center; text-align:center; gap:3px; }
  .tile .th { display:flex; align-items:center; gap:5px; }
  .tile strong { font-weight:500; font-size:14px; letter-spacing:.02em; }
  .tile .site { font-size:11px; line-height:1.3; color:var(--muted); }
  .btn { position:relative; overflow:hidden; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px;
         width:100%; padding:11px; border-radius:12px; font-size:15px; font-weight:500;
         text-decoration:none; border:none; cursor:pointer; animation:press 3s ease-in-out infinite; }
  .btn::after { content:""; position:absolute; top:0; left:0; width:35%; height:100%;
                background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent); animation:sweep 2.8s ease-in-out infinite; }
  .btn.primary { background:var(--accent); color:var(--text); }
  .maison { display:block; margin-top:18px; text-align:center; font-size:14px; color:var(--text); text-decoration:underline; text-underline-offset:3px; }
  .icons { display:flex; justify-content:center; gap:40px; margin-top:12px; }
  .li, .lo { display:block; width:44px; height:44px; }
  .lo { border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; animation:pulse 2s ease-out infinite; }
  .lo img { width:56%; height:auto; display:block; }
  .li { border-radius:50%; background:#007EBB; overflow:hidden; display:flex; align-items:center; justify-content:center; animation:pulseb 2s ease-out 1s infinite; }
  .li img { width:80%; height:80%; display:block; }

  /* ---- Animations : apparition façon AirDrop, cascade, photo vivante, micro-interactions ---- */
  @property --r { syntax:"<length>"; inherits:false; initial-value:0px; }
  @keyframes wipe { from{--r:0px} to{--r:1500px} }
  @keyframes vanish { to{opacity:0; visibility:hidden} }
  .veil { position:fixed; inset:0; z-index:1; pointer-events:none; background:#F2E9DB;
          -webkit-mask-image:radial-gradient(circle at 50% 0, transparent var(--r), #000 calc(var(--r) + 2px));
                  mask-image:radial-gradient(circle at 50% 0, transparent var(--r), #000 calc(var(--r) + 2px));
          animation:wipe 2s cubic-bezier(.2,.7,.2,1) .1s both, vanish .01s 2.2s forwards; }
  @keyframes airglow { 0%{opacity:0; transform:scale(.4)} 25%{opacity:1} 100%{opacity:0; transform:scale(2.2)} }
  @keyframes emerge { from{opacity:0; transform:translateY(-34px) scale(.92); filter:blur(14px)} to{opacity:1; transform:none; filter:none} }
  @keyframes up { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:none} }
  @keyframes pop { 0%{opacity:0; transform:scale(.6)} 70%{transform:scale(1.08)} 100%{opacity:1; transform:scale(1)} }
  @keyframes reveal { from{clip-path:inset(0 100% 0 0)} to{clip-path:inset(0 0 0 0)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(255,199,0,.75)} 100%{box-shadow:0 0 0 16px rgba(255,199,0,0)} }
  @keyframes pulseb { 0%{box-shadow:0 0 0 0 rgba(0,126,187,.75)} 100%{box-shadow:0 0 0 16px rgba(0,126,187,0)} }
  @keyframes sweep { 0%{transform:translateX(-130%)} 60%,100%{transform:translateX(330%)} }
  @keyframes press { 0%,86%,100%{transform:scale(1)} 92%{transform:scale(.95)} }
  .glow { position:fixed; top:-120px; left:0; right:0; height:620px; z-index:4; pointer-events:none; transform-origin:50% 0;
          background:radial-gradient(ellipse at 50% 20%,rgba(255,199,0,.55),rgba(255,236,170,.25) 40%,rgba(255,255,255,0) 70%);
          animation:airglow 2.6s ease-out both; }
  .s { animation:up .6s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i)*90ms + 1.5s); }
  .s.avwrap { animation:pop .7s cubic-bezier(.2,.7,.2,1) 1.6s both; }
  .s.nm { animation:reveal 1s ease 1.9s both; }
  .s.badge { animation:pop .6s cubic-bezier(.2,.7,.2,1) 2.4s both; }
  .tap { transition:transform .15s; }
  .tap:active { transform:scale(.96); }
  @media (max-height:700px) { .avwrap{width:84px} .avatar{width:84px; height:84px} .bio{font-size:12px} }
  @media (prefers-reduced-motion: reduce) { .top { animation:none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header class="top"><div class="org" id="org"></div></header>
<div class="glow" aria-hidden="true"></div>
<div class="card">
  <div class="avwrap">
    <div class="ring"></div>
    <div class="avatar" id="avatar"></div>
  </div>
  <h1 class="nm" id="fullname"></h1>
  <span class="badge" id="badge"></span>
  <div class="title" id="jobtitle"></div>
  <hr class="sep" id="sep">
  <p class="bio" id="bio"></p>

  <div class="infos" id="infos"></div>
  <div class="lieux" id="lieux"></div>

  <div id="btnwrap"><button class="btn primary tap" id="addBtn"></button></div>
  <div class="icons">
    <a class="lo tap" id="maisonLink" target="_blank" rel="noopener" aria-label="Découvrir la Maison L'Occitane en Provence"><img src="lo.png" alt="L'Occitane en Provence"></a>
    <a class="li tap" id="linkedinBtn" target="_blank" rel="noopener" aria-label="Profil LinkedIn"><img src="linkedin.svg" alt="LinkedIn"></a>
  </div>
</div>

<script>
/* ============ À MODIFIER : tes informations ============ */
const C = {
  prenom:   "Guillaume",
  nom:      "Rodriguez",
  titre:    "Clinical Evaluation & Neurosciences Research Specialist",
  societe:  "L'Occitane en Provence",
  tel:      "+33 4 92 70 62 86",
  email:    "guillaume.rodriguez@loccitane.com",
  linkedin: "https://www.linkedin.com/in/guillaume-rodriguez-phd-64070898/",
  bio:      "Developing the neuroscience strategy at L'Occitane en Provence. Innovation and scientific rigor, applied to clinical evaluation.",
  lienSociete: "https://fr.loccitane.com/qui-sommes-nous",   // le logo renvoie vers cette page
  badge:    "PhD",         // laisse "" pour ne pas afficher de badge
  logo:     "logo.png",    // laisse "" pour afficher le nom de la société en texte
  photo:    "photo.jpg",   // laisse "" pour afficher les initiales
  lieux:    [
    { ville: "Manosque",  site: "R&D Center" },
    { ville: "Marseille", site: "Cosnat Neuroscience & Clinical Evaluation Lab" }
  ]
};
/* ======================================================== */

const full = C.prenom + " " + C.nom;
document.title = full + " – Carte de visite";
document.getElementById("fullname").innerHTML = '<span class="fn"></span> <span class="ln"></span>';
document.querySelector("#fullname .fn").textContent = C.prenom;
document.querySelector("#fullname .ln").textContent = C.nom;
const jobtitle = document.getElementById("jobtitle");
const jobspan = document.createElement("span");
jobspan.textContent = C.titre;
jobtitle.appendChild(jobspan);
function fitTitle() {
  const avail = document.querySelector(".card").clientWidth - 32;
  let size = 13;
  jobtitle.style.fontSize = size + "px";
  while (jobspan.offsetWidth > avail && size > 6) {
    size -= 0.25;
    jobtitle.style.fontSize = size + "px";
  }
}
fitTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
window.addEventListener("resize", fitTitle);
if (C.bio) document.getElementById("bio").textContent = C.bio; else { document.getElementById("bio").remove(); document.getElementById("sep").remove(); }
const org = document.getElementById("org");
if (C.logo) {
  const logo = document.createElement("img");
  logo.src = C.logo;
  logo.alt = C.societe;
  logo.onerror = () => { org.textContent = C.societe; };
  if (C.lienSociete) {
    const a = document.createElement("a");
    a.href = C.lienSociete;
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", C.societe);
    a.appendChild(logo);
    org.appendChild(a);
  } else {
    org.appendChild(logo);
  }
} else {
  org.textContent = C.societe;
}
const badge = document.getElementById("badge");
if (C.badge) badge.textContent = C.badge; else badge.remove();
const avatar = document.getElementById("avatar");
if (C.photo) {
  const img = document.createElement("img");
  img.src = C.photo;
  img.alt = full;
  img.onerror = () => { avatar.textContent = (C.prenom[0] + C.nom[0]).toUpperCase(); };
  avatar.appendChild(img);
} else {
  avatar.textContent = (C.prenom[0] + C.nom[0]).toUpperCase();
}
document.getElementById("linkedinBtn").href = C.linkedin;
const maison = document.getElementById("maisonLink");
if (C.lienSociete) maison.href = C.lienSociete; else maison.remove();

const ICON = (d) => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3F2B2E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
const ICONS = {
  phone: ICON('<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>'),
  mail:  ICON('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
  pin:   ICON('<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>')
};

const infos = document.getElementById("infos");
[["phone", C.tel, "tel:" + C.tel.replace(/\s/g,"")],
 ["mail", C.email, "mailto:" + C.email]].forEach(([ic, label, href]) => {
  if (!label) return;
  const a = document.createElement("a");
  a.href = href;
  a.className = "tap";
  a.innerHTML = ICONS[ic] + '<span></span>';
  a.lastChild.textContent = label;
  infos.appendChild(a);
});

const lieux = document.getElementById("lieux");
(C.lieux || []).forEach(l => {
  const t = document.createElement("div");
  t.className = "tile tap";
  t.innerHTML = '<div class="th">' + ICONS.pin + '<strong></strong></div><span class="site"></span>';
  t.querySelector("strong").textContent = l.ville;
  t.querySelector(".site").textContent = l.site;
  lieux.appendChild(t);
});

const addBtn = document.getElementById("addBtn");
addBtn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3F2B2E" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add to contacts';

/* Cascade d'entrée : chaque bloc de la carte reçoit son rang */
[...document.querySelector(".card").children].forEach((el, i) => {
  el.classList.add("s");
  el.style.setProperty("--i", i);
});

function vcard() {
  return [
    "BEGIN:VCARD", "VERSION:3.0",
    "N:" + C.nom + ";" + C.prenom + ";;;",
    "FN:" + full,
    "ORG:" + C.societe,
    "TITLE:" + C.titre,
    "TEL;TYPE=WORK,VOICE:" + C.tel,
    "EMAIL;TYPE=INTERNET:" + C.email,
    "URL;TYPE=LinkedIn:" + C.linkedin,
    "END:VCARD"
  ].filter(Boolean).join("\r\n");
}

document.getElementById("addBtn").addEventListener("click", () => {
  const blob = new Blob([vcard()], { type: "text/vcard;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (C.prenom + "-" + C.nom).toLowerCase() + ".vcf";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
});
</script>
</body>
</html>
